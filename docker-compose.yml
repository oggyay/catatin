services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-catatin}
      POSTGRES_USER: ${POSTGRES_USER:-catatin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-catatin_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-catatin}:${POSTGRES_PASSWORD:-catatin_dev_password}@postgres:5432/${POSTGRES_DB:-catatin}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-before-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost:8080}
      OTP_LENGTH: ${OTP_LENGTH:-6}
      OTP_EXPIRES_MINUTES: ${OTP_EXPIRES_MINUTES:-5}
      OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS:-5}
      OTP_RATE_LIMIT_COUNT: ${OTP_RATE_LIMIT_COUNT:-3}
      OTP_RATE_LIMIT_WINDOW_MINUTES: ${OTP_RATE_LIMIT_WINDOW_MINUTES:-15}
      WA_PROVIDER: ${WA_PROVIDER:-mock}
      WAHA_BASE_URL: ${WAHA_BASE_URL:-http://host.containers.internal:3000}
      WAHA_SESSION: ${WAHA_SESSION:-default}
      WAHA_API_KEY: ${WAHA_API_KEY:-}
      WA_AKG_BASE_URL: ${WA_AKG_BASE_URL:-}
      WA_AKG_API_KEY: ${WA_AKG_API_KEY:-}
      WA_AKG_DEVICE_ID: ${WA_AKG_DEVICE_ID:-}
      AI_PARSER_ENABLED: ${AI_PARSER_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      WA_PENDING_EXPIRES_MINUTES: ${WA_PENDING_EXPIRES_MINUTES:-10}
      UPLOAD_DIR: /app/uploads
      PLATFORM_ADMIN_WHATSAPP: ${PLATFORM_ADMIN_WHATSAPP:-}
    volumes:
      - uploads_data:/app/uploads
    expose:
      - "4000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  postgres_data:
  redis_data:
  uploads_data:
